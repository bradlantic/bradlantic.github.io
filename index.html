    @font-face {

    @font-face {

    :root {

      --void: #0A0A0C;

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

      font-family: system-ui, sans-serif;

    }
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sky .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .sky .veil {
      position: absolute;
      inset: 0;
      background:

    }
    .page {
      position: relative;
      z-index: 1;
      width: min(26.5rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.7rem 0 3.5rem;
      padding-bottom: max(3.5rem, env(safe-area-inset-bottom));
    }
    header { text-align: center; }
    .visually-hidden { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }
    .mark {

      height: auto;
      display: block;
      margin: 0 auto 0.35rem;
      filter: drop-shadow(0 10px 22px rgba(10, 10, 12, 0.45));
    }
    .brand {
      margin: 0;
      font-family: Anton, system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(2.15rem, 10.2vw, 2.9rem);
      letter-spacing: 0.06em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 0 rgba(10, 10, 12, 0.45), 0 8px 28px rgba(10, 10, 12, 0.55);
    }
    .tagline {
      margin: 0.3rem 0 0;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--chrome);
      line-height: 1.35;
      text-shadow: 0 1px 8px rgba(69, 39, 103, 0.45);
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1.15rem;
    }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      min-height: 3.45rem;
      padding: 0.8rem 1.1rem;
      border-radius: 1.05rem;
      background: #0A0A0C;
      border: 2px solid #E0407B;
      box-shadow: 0 0 0 1px rgba(224, 64, 123, 0.2), 0 0 18px rgba(224, 64, 123, 0.32);
      color: #fff;
      text-decoration: none;
      font-family: "Bebas Neue", system-ui, sans-serif;
      font-weight: 400;
      font-size: 1.45rem;
      letter-spacing: 0.08em;
      line-height: 1;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }
    a.btn:hover, a.btn:focus-visible {
      transform: translateY(-1px);
      border-color: #F07AA3;
      box-shadow: 0 0 0 1px rgba(224, 64, 123, 0.35), 0 0 26px rgba(224, 64, 123, 0.5);
      outline: none;
    }
    a.btn:active { transform: translateY(0); }
    a.btn svg { width: 1.2rem; height: 1.2rem; fill: currentColor; flex: 0 0 auto; }
    a.btn.packs {
      border-color: #E0407B;
      box-shadow: 0 0 0 1px rgba(69, 39, 103, 0.55), 0 0 22px rgba(224, 64, 123, 0.5);
      min-height: 3.7rem;
      font-size: 1.55rem;
    }
    a.btn.packs:hover, a.btn.packs:focus-visible {
      border-color: #fff;
      box-shadow: 0 0 0 1px rgba(224, 64, 123, 0.5), 0 0 28px rgba(224, 64, 123, 0.62);

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
      text-shadow: 0 1px 6px rgba(69, 39, 103, 0.5);
